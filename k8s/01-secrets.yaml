# Credenciales solo para Lab / demo EP3. No usar en producción.
apiVersion: v1
kind: Secret
metadata:
  name: tienda-db
  namespace: tienda
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: ep3-root-lab-only
  MYSQL_DATABASE: tienda_perritos
  MYSQL_USER: alumno
  MYSQL_PASSWORD: ep3-app-lab-only
  DB_USER: alumno
  DB_PASSWORD: ep3-app-lab-only
  DB_NAME: tienda_perritos
  DB_PORT: "3306"
