apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: tienda
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS tienda_perritos;
    USE tienda_perritos;
    CREATE TABLE IF NOT EXISTS productos (
        id INT AUTO_INCREMENT PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        descripcion VARCHAR(255),
        precio DECIMAL(10,2) NOT NULL,
        stock INT NOT NULL
    );
    INSERT INTO productos (nombre, descripcion, precio, stock) VALUES
    ('Alimento Cachorro Premium', 'Sabor a pollo, razas pequenas', 19990, 15),
    ('Alimento Adulto Light', 'Control de peso, razas medianas', 17990, 8),
    ('Snacks Dentales', 'Ayuda a la limpieza dental', 5990, 30),
    ('Alimento Adulto Pedigree', 'Sabor carne', 15990, 40),
    ('Bravery pollo Adulto raza pequena', 'Sabor a pollo', 25990, 20);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: tienda
  labels:
    app: db
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        version: v1
    spec:
      containers:
        - name: db
          image: IMAGE_DB
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tienda-db
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: tienda-db
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: tienda-db
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tienda-db
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pep3-root-lab-only"]
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: init
          configMap:
            name: mysql-init
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: tienda
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
