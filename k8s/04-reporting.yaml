apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: tienda
  labels:
    app: reporting-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
        version: v1
    spec:
      containers:
        - name: reporting
          image: IMAGE_REPORTING
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: BACKEND_URL
              value: http://backend:3001
            - name: HTTP_TIMEOUT_SECONDS
              value: "5"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: tienda
  labels:
    app: reporting-service
spec:
  selector:
    app: reporting-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
