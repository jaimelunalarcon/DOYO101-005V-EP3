# Expone la tienda por el Ingress Gateway de Istio (LoadBalancer).
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: tienda-gateway
  namespace: tienda
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: tienda
  namespace: tienda
spec:
  hosts:
    - "*"
  gateways:
    - tienda-gateway
  http:
    - match:
        - uri:
            prefix: /reports/
      route:
        - destination:
            host: reporting-service
            port:
              number: 8000
    - match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: backend
            port:
              number: 3001
    - route:
        - destination:
            host: frontend
            port:
              number: 80
